name: Incompatible Sample Report (不兼容样本反馈)
description: 提交在 runidbg 中报错、缺失符号/系统调用/JNI 或结果不一致的 Android ARM64 .so 样本
title: "[Sample] "
labels: ["compat", "sample"]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助完善 `runidbg` 的兼容性！
        **请务必先脱敏**：移除任何真实 Cookie、Token、密钥或隐私数据。

  - type: input
    id: library
    attributes:
      label: 目标 .so 名称与来源（可选）
      placeholder: 例如 libexample.so (ARM64, Android 14)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现脚本（QuickJS 或 Rust）
      description: 请提供脱敏后的最小复现代码与输入参数
      render: javascript
    validations:
      required: true

  - type: textarea
    id: envdiag
    attributes:
      label: EnvDiag 诊断输出
      description: 运行 `console.log(JSON.stringify(emu.diag.report(), null, 2))` 的输出
      render: json

  - type: textarea
    id: crash
    attributes:
      label: 崩溃报告或错误日志
      description: 运行 `console.log(emu.lastCrash()?.formatted)` 或 CLI stderr 日志
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已移除所有真实 Cookie / Token / 敏感凭据
          required: true
        - label: 目标库为 Android ARM64 (aarch64)
          required: true
