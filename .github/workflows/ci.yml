name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake ninja-build libclang-dev

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake ninja

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run full test suite
        run: cargo test

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Clippy (js only)
        run: cargo clippy --no-default-features --features js --all-targets -- -D warnings

      - name: Clippy (mcp only)
        run: cargo clippy --no-default-features --features mcp --all-targets -- -D warnings

      - name: Clippy & test (ui feature)
        run: cargo clippy --features ui --all-targets -- -D warnings && cargo test --features ui --test ui_web
