name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: CI (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64 (unicorn + dynarmic + hypervisor)
            os: macos-latest
            expected_backends: "unicorn, dynarmic, hypervisor"
          - label: linux-x86_64 (unicorn + dynarmic + kvm)
            os: ubuntu-latest
            expected_backends: "unicorn, dynarmic, kvm"
          - label: linux-arm64 (unicorn + dynarmic + kvm)
            os: ubuntu-24.04-arm
            expected_backends: "unicorn, dynarmic, kvm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake ninja-build clang libclang-dev

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake ninja

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (no default features / unicorn only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Clippy (js only)
        run: cargo clippy --no-default-features --features js --all-targets -- -D warnings

      - name: Clippy (mcp only)
        run: cargo clippy --no-default-features --features mcp --all-targets -- -D warnings

      - name: Clippy (dynarmic only)
        run: cargo clippy --no-default-features --features dynarmic --all-targets -- -D warnings

      - name: Run full test suite
        run: cargo test

      - name: Build CLI and verify compiled backends
        run: |
          cargo build --bin runidbg-cli
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - --entitlements entitlements/hypervisor.plist target/debug/runidbg-cli
          fi
          ./target/debug/runidbg-cli --help 2>&1 | tee /tmp/cli-help.txt
          grep -F "${{ matrix.expected_backends }}" /tmp/cli-help.txt
